apiVersion: v1
kind: Namespace
metadata:
  name: hermes-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-controller
  namespace: hermes-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["hermes.cloudpilot.ai"]
    resources: ["hermespolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hermes.cloudpilot.ai"]
    resources: ["hermespolicies/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-controller
subjects:
  - kind: ServiceAccount
    name: hermes-controller
    namespace: hermes-system
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hermes-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-cache
  namespace: hermes-system
spec:
  storageClassName: hermes-gp3
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-controller
  namespace: hermes-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-controller
  template:
    metadata:
      labels:
        app: hermes-controller
    spec:
      serviceAccountName: hermes-controller
      containers:
        - name: controller
          # Replace with your published controller image.
          image: public.ecr.aws/cloudpilotai/hermes-controller:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          args:
            - --listen=:39091
            - --db=/data/hermes/hermes-cache.db
            - --platform=linux/amd64
            - --max-concurrency=1
            - --containerd-address=/run/containerd/containerd.sock
            - --containerd-namespace=k8s.io
            - --hermes-root=/var/lib/hermes
          ports:
            - name: http
              containerPort: 39091
          volumeMounts:
            - name: cache
              mountPath: /data/hermes
            - name: containerd
              mountPath: /run/containerd/containerd.sock
            - name: hermes-root
              mountPath: /var/lib/hermes
          resources:
            requests:
              cpu: 8
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hermes-cache
        - name: containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: hermes-root
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-controller
  namespace: hermes-system
spec:
  type: NodePort
  selector:
    app: hermes-controller
  ports:
    - name: http
      port: 39091
      targetPort: 39091
      nodePort: 30080
